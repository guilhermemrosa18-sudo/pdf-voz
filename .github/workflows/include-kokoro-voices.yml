name: Include Kokoro Portuguese voices

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download embedded voices
        run: |
          set -e
          mkdir -p voices
          curl -L --fail --retry 3 -o voices/pf_dora.bin https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/pf_dora.bin
          curl -L --fail --retry 3 -o voices/pm_alex.bin https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/pm_alex.bin

      - name: Commit voice files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voices/pf_dora.bin voices/pm_alex.bin
          if git diff --cached --quiet; then
            echo "Voice files already up to date."
          else
            git commit -m "Adicionar vozes Kokoro PT-BR embutidas"
            git push
          fi
